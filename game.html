<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Game Komponen Komputer Futuristik</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap');

body{
  margin:0;
  font-family:'Orbitron', sans-serif;
  background: radial-gradient(circle at top, #0f172a, #020617);
  color:#e2e8f0;
  text-align:center;
  padding:20px;
}

/* TITLE */
h1{
  font-size:28px;
  text-shadow:0 0 15px #38bdf8;
}

/* LAYOUT */
.container{
  display:flex;
  justify-content:center;
  gap:30px;
  flex-wrap:wrap;
  margin-top:20px;
}

/* GLASS BOX */
.box{
  width:320px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 0 20px rgba(56,189,248,0.15);
  transition:0.3s;
}

.box:hover{
  transform:translateY(-5px);
  box-shadow:0 0 25px rgba(56,189,248,0.3);
}

/* ITEM CARD */
.item{
  background:linear-gradient(145deg,#0ea5e9,#2563eb);
  color:white;
  margin:10px 0;
  padding:10px;
  border-radius:12px;
  cursor:grab;
  transition:0.3s;
  box-shadow:0 0 10px rgba(59,130,246,0.4);
}

.item:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px rgba(56,189,248,0.6);
}

/* IMAGE */
.item img{
  border-radius:10px;
  margin-bottom:5px;
}

/* CPU AREA */
.cpu{
  min-height:260px;
  border:2px dashed #38bdf8;
  border-radius:15px;
  padding:15px;
  background:rgba(56,189,248,0.05);
  transition:0.3s;
}

.cpu:hover{
  box-shadow:0 0 20px rgba(56,189,248,0.3);
}

/* INFO BOX */
#infoBox{
  margin-top:20px;
  padding:15px;
  border-radius:12px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  min-height:50px;
  backdrop-filter: blur(10px);
}

/* SCORE */
#score{
  margin-top:15px;
  font-size:18px;
  color:#38bdf8;
  text-shadow:0 0 10px #38bdf8;
}

/* EFFECT */
.correct{
  border:2px solid #22c55e !important;
  box-shadow:0 0 15px #22c55e;
}

.wrong{
  border:2px solid #ef4444 !important;
  box-shadow:0 0 15px #ef4444;
}
</style>
</head>

<body>

<h1>🧠 GAME KOMPONEN KOMPUTER</h1>
<p>Drag ke CPU Area & klik untuk info</p>

<div class="container">

<!-- LIST -->
<div class="box">
<h3>Komponen</h3>

<div class="item" draggable="true" id="keyboard" onclick="showInfo('Keyboard: alat input teks.')">
<img src="https://i5.walmartimages.com/asr/48b6c361-d1cc-4562-b5fa-a6e0b4a961c6.f471d9dcc4cb23bf3b79722e9f27961f.jpeg" width="100"><br>
Keyboard
</div>

<div class="item" draggable="true" id="monitor" onclick="showInfo('Monitor: menampilkan output visual.')">
<img src="https://www.sceptre.com/image/cache/data/product_gallery/1458-C275B-FWT240/Tilt%20Up%20View-1500x1044.jpg" width="100"><br>
Monitor
</div>

<div class="item" draggable="true" id="ram" onclick="showInfo('RAM: memori sementara.')">
<img src="https://1.bp.blogspot.com/-H0bE5wazLLY/XyOdae-xHrI/AAAAAAAAAgw/nSX4q872Y0o6HcsLiOusbvLhYO31FfjpACLcBGAsYHQ/s2048/ram-1515556.jpg" width="100"><br>
RAM
</div>

<div class="item" draggable="true" id="mouse" onclick="showInfo('Mouse: navigasi kursor.')">
<img src="https://www.bhphotovideo.com/images/images2500x2500/logitech_910_005790_g203_lightsync_gaming_mouse_1574402.jpg" width="100"><br>
Mouse
</div>

<div class="item" draggable="true" id="powersupply" onclick="showInfo('Power Supply: sumber listrik PC.')">
<img src="https://ritaelfianis.id/wp-content/uploads/2022/09/Apa-itu-Power-Supply-Cara-Memilih-Untuk-PC-Anda.jpg" width="100"><br>
Power Supply
</div>

<div class="item" draggable="true" id="processor" onclick="showInfo('Processor: otak komputer.')">
<img src="https://www.scientecheasy.com/wp-content/uploads/2023/07/cpu-diagram.png" width="100"><br>
Processor
</div>

<div class="item" draggable="true" id="ssd" onclick="showInfo('SSD (Solid State Drive): adalah media penyimpanan modern yang menggunakan chip memori flash (seperti flashdisk, tapi lebih canggih).')">
<img src="https://m.media-amazon.com/images/I/614b653JNXL._AC_.jpg" width="100"><br>
SSD
</div>

<div class="item" draggable="true" id="hdd" onclick="showInfo('HDD (Hard Disk Drive): adalah media penyimpanan tradisional yang menggunakan cakram magnetik.')">
<img src="https://media.rs-online.com/image/upload/bo_1.5px_solid_white,b_auto,c_pad,dpr_2,f_auto,h_399,q_auto,w_710/c_pad,h_399,w_710/F1828699-01?pgw=1" width="100"><br>
HDD
</div>

<div class="item" draggable="true" id="motherboard" onclick="showInfo('Motherboard: papan sirkuit utama yang menghubungkan semua komponen PC.')">
<img src="https://cdn.britannica.com/64/170564-050-7A0A86A2/motherboard-for-computer.jpg" width="100"><br>
Motherboard
</div>

<div class="item" draggable="true" id="kabellan" onclick="showInfo('Kabel Lan: bukan komponen PC 🚫')">
<img src="https://media.s-bol.com/RlxNwGRr6NxE/1200x1058.jpg" width="100"><br>
Kabel Lan
</div>

<div class="item" draggable="true" id="infocus" onclick="showInfo('Infocus: bukan komponen PC 🚫')">
<img src="https://4.bp.blogspot.com/-yL-P626Ac8g/XItOSYgw2fI/AAAAAAAAADs/_imGoK1IArkg9vhEbPFo-qraoiGYiua6gCLcBGAs/s1600/Proyektor_Acer_X1123H_3.jpg" width="100"><br>
Infocus
</div>



</div>

<!-- CPU -->
<div class="box">
<h3>⚡ CPU CORE</h3>
<div class="cpu" id="cpuBox">Drop komponen di sini</div>
</div>

</div>

<div id="infoBox">Klik komponen untuk detail</div>
<div id="score">Skor: 0</div>

<script>
let score = 0;
const correct = ["keyboard","monitor","ram","mouse","powersupply","processor","ssd","hdd","motherboard"];

const items = document.querySelectorAll('.item');
const cpuBox = document.getElementById('cpuBox');

items.forEach(item=>{
  item.addEventListener('dragstart', e=>{
    e.dataTransfer.setData("text", e.target.id);
  });
});

cpuBox.addEventListener('dragover', e=>e.preventDefault());

cpuBox.addEventListener('drop', e=>{
  e.preventDefault();

  let id = e.dataTransfer.getData("text");
  let el = document.getElementById(id);

  if(correct.includes(id)){
    cpuBox.appendChild(el);
    el.classList.add("correct");
    score += 10;
  } else {
    el.classList.add("wrong");
    score -= 5;
  }

  document.getElementById("score").innerText = "Skor: " + score;
});

function showInfo(text){
  document.getElementById("infoBox").innerText = text;
}
</script>

</body>
</html>
